name: Deploy AI Code Review Platform

on:
  push:
    branches: [master]

env:
  AWS_REGION: us-east-1

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.tf-output.outputs.api_url }}
      webhook_url: ${{ steps.tf-output.outputs.webhook_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Build OpenAI Lambda layer
        run: |
          mkdir -p lambda_layer_build/python
          pip install openai -t lambda_layer_build/python/ \
            --platform manylinux2014_x86_64 \
            --python-version 3.11 \
            --only-binary=:all: \
            --implementation cp
          cd lambda_layer_build
          zip -r ../lambda/openai_layer.zip python/
          cd ..

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init
        working-directory: terraform

      - name: Terraform apply
        run: |
          terraform apply -auto-approve \
            -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}" \
            -var="github_token=${{ secrets.GHUB_TOKEN_SECRET }}" \
            -var="webhook_secret=${{ secrets.WEBHOOK_SECRET }}"
        working-directory: terraform

      - name: Get outputs
        id: tf-output
        run: |
          echo "api_url=$(terraform output -raw api_url)" >> $GITHUB_OUTPUT
          echo "webhook_url=$(terraform output -raw webhook_url)" >> $GITHUB_OUTPUT
        working-directory: terraform

  notify-vercel:
    name: Show Vercel Deploy Info
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Print webhook URL
        run: |
          echo "Backend deployed successfully"
          echo "Webhook URL: ${{ needs.deploy-backend.outputs.webhook_url }}"
          echo "API URL: ${{ needs.deploy-backend.outputs.api_url }}"
          echo "Set NEXT_PUBLIC_API_URL=${{ needs.deploy-backend.outputs.api_url }} in Vercel environment variables"